<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>墨笔</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f6feb'/%3E%3Ctext x='16' y='23' font-size='19' font-family='serif' fill='%23fff' text-anchor='middle'%3E%E5%A2%A8%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./vditor/dist/index.css" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <header id="topbar">
      <div class="brand">墨笔</div>
      <div id="doc-name" class="doc-name">未命名.md</div>
      <div class="actions">
        <button id="btn-open" title="打开 (Ctrl+O)">打开</button>
        <button id="btn-save" title="保存 (Ctrl+S)">保存</button>
        <button id="btn-save-as" title="另存为 (Ctrl+Shift+S)">另存为</button>
        <button id="btn-theme" title="切换主题">暗色</button>
      </div>
    </header>

    <main id="editor-host">
      <div id="vditor"></div>
    </main>

    <footer id="statusbar">
      <span id="status-msg">就绪</span>
      <span class="spacer"></span>
      <span id="status-meta"></span>
    </footer>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
